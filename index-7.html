<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>فرع المعلوماتية الطبية</title>
<meta name="description" content="جدول المحاضرات والملفات والواجبات لطلبة المرحلة الرابعة - فرع المعلوماتية الطبية، كلية العلوم، جامعة ديالى">
<meta name="theme-color" content="#0d2b36">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout: dark clinical hero (logo, title, settings) -> alerts card -> Arabic ticker -> course switch + tabs -> day-by-day schedule / subjects with files / homework -> credit footer */
:root{
  --bg:#edf3f4; --surface:#ffffff; --surface2:#f4f8f9; --ink:#0d2b36; --muted:#587078; --line:#d3e0e3;
  --accent:#0b7f7a; --accent-ink:#ffffff; --accent-soft:#d9f0ee;
  --warn:#9a6200; --warn-soft:#fbefcf; --bad:#b3392f; --bad-soft:#fbe2df;
  --hero:#0d2b36; --hero-ink:#eaf6f6; --hero-muted:#9bc3c6; --shadow:0 1px 2px rgba(13,43,54,.06),0 6px 18px rgba(13,43,54,.06);
  --blue:#1456d1; --blue-deep:#0b2f7d; --on-blue:#ffffff; --yellow:#ffc21a; --yellow-deep:#a87600; --on-yellow:#1c1500; --blue-hi:#5b9dff; --yellow-hi:#ffd23f;
  --f-body:'IBM Plex Sans Arabic','Tahoma',sans-serif; --f-display:var(--f-body); --f-title:'Reem Kufi','Tahoma',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08171c; --surface:#102329; --surface2:#16303a; --ink:#e4f0f2; --muted:#8ba7af; --line:#22414b;
  --accent:#3cc7bd; --accent-ink:#052a29; --accent-soft:#12403f;
  --warn:#f0b840; --warn-soft:#3a2f10; --bad:#ff8a7d; --bad-soft:#3e1a17;
  --blue:#5b9dff; --blue-deep:#1c4fa8; --on-blue:#04163a; --yellow:#ffd23f; --yellow-deep:#b88a00; --on-yellow:#1c1500;
  --hero:#0b2630; --hero-ink:#eaf6f6; --hero-muted:#8dbcc0; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08171c; --surface:#102329; --surface2:#16303a; --ink:#e4f0f2; --muted:#8ba7af; --line:#22414b;
  --accent:#3cc7bd; --accent-ink:#052a29; --accent-soft:#12403f;
  --warn:#f0b840; --warn-soft:#3a2f10; --bad:#ff8a7d; --bad-soft:#3e1a17;
  --blue:#5b9dff; --blue-deep:#1c4fa8; --on-blue:#04163a; --yellow:#ffd23f; --yellow-deep:#b88a00; --on-yellow:#1c1500;
  --hero:#0b2630; --hero-ink:#eaf6f6; --hero-muted:#8dbcc0; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 var(--f-body);direction:rtl;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:600}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);position:relative;overflow:hidden}
.hero svg.ecg{position:absolute;inset:auto 0 0 0;width:100%;height:70px;opacity:.35;pointer-events:none}
.ecg path{stroke:var(--accent);fill:none;stroke-width:2;stroke-dasharray:900;stroke-dashoffset:900;animation:ecg 5s linear infinite}
@keyframes ecg{to{stroke-dashoffset:-900}}
.hero .row{display:flex;align-items:center;gap:14px;padding-block:18px 26px;position:relative}
.logo{flex:none;width:58px;height:58px;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);display:grid;place-items:center;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;transition:transform .15s}
.logo:active{transform:scale(.94)}
.logo svg{width:36px;height:36px}
.hero h1{font-family:var(--f-title);font-weight:700;font-size:clamp(1.35rem,4.6vw,2.1rem);line-height:1.3}
.hero p{margin:2px 0 0;color:var(--hero-muted);font-size:.86rem}
.hero .grow{flex:1;min-width:0}
.ibtn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:var(--hero-ink);display:grid;place-items:center;padding:0}
.ibtn:hover{background:rgba(255,255,255,.16)}
.ibtn svg{width:22px;height:22px}
.admbar{background:var(--accent);color:var(--accent-ink);font-size:.86rem}
.admbar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:8px}
.admbar b{font-weight:700}
.admbar .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:500;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;min-height:32px;font-size:.84rem}
.admbar .btn{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:var(--accent-ink)}

/* notices */
.notices{margin-top:-14px;position:relative}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.notices .card{padding:14px 16px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sec-h h2{font-size:1.1rem}
.sec-h .sp{flex:1}
.nlist{display:grid;gap:8px}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.note .tx{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.pill{flex:none;font-size:.74rem;font-weight:600;padding:1px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-top:2px}
.note.alert{background:var(--warn-soft);border-color:transparent}.note.alert .pill{background:var(--warn);color:var(--surface)}
.note.urgent{background:var(--bad-soft);border-color:transparent}.note.urgent .pill{background:var(--bad);color:var(--surface)}
.empty{color:var(--muted);padding:10px 4px;font-size:.92rem}

/* ticker */
.ticker{margin-top:14px;display:flex;border-radius:14px;overflow:hidden;background:var(--hero);color:var(--hero-ink);border:1px solid var(--line)}
.ticker .lb{flex:none;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:600;padding:8px 16px;display:flex;align-items:center;white-space:nowrap}
.ticker .vp{flex:1;min-width:0;overflow:hidden;direction:ltr;display:flex;align-items:center}
.tk-in{display:inline-flex;white-space:nowrap;animation:tk var(--dur,40s) linear infinite;will-change:transform}
.ticker:hover .tk-in{animation-play-state:paused}
@keyframes tk{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.tk-set{display:inline-flex;direction:rtl}
.tk-set span{padding:9px 0 9px 0;display:inline-flex;align-items:center}
.tk-set span::after{content:"";width:7px;height:7px;background:var(--accent);transform:rotate(45deg);margin:0 26px;flex:none}

/* controls */
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 16px;font-weight:600;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;position:relative}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-inline-start:6px}
main{padding-block:18px 28px}
.next{display:flex;gap:12px;align-items:center;padding:12px 16px;margin-bottom:16px;background:var(--accent-soft);border:1px solid transparent;border-radius:14px;flex-wrap:wrap}
.next b{color:var(--accent)}
.next .sp{flex:1}

/* schedule */
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.day{padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.day h3{font-size:1.05rem;display:flex;align-items:center;gap:8px}
.badge{font-family:var(--f-body);font-size:.7rem;font-weight:600;background:var(--accent);color:var(--accent-ink);padding:0 8px;border-radius:99px}
.slot{border-radius:12px;background:var(--surface2);border:1px solid var(--line);padding:9px 11px;border-inline-start:5px solid var(--c,var(--accent));display:grid;gap:2px;min-width:0}
.slot .tm{font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--muted)}
.slot .nm{font-weight:600;overflow-wrap:anywhere}
.slot .dr{font-size:.86rem;color:var(--muted)}
.slot .ft{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.tag{font-size:.74rem;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:0 9px;color:var(--muted)}
.slot.now{box-shadow:0 0 0 2px var(--accent)}
.noday{color:var(--muted);font-size:.88rem;padding:6px 2px}

/* subjects */
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.sub{padding:0;overflow:hidden;min-width:0;display:flex;flex-direction:column}
.sub .hd{padding:14px 16px;border-top:5px solid var(--c,var(--accent));display:flex;gap:10px;align-items:flex-start}
.sub .hd .t{flex:1;min-width:0}
.sub h3{font-size:1.1rem;overflow-wrap:anywhere}
.sub .dr{color:var(--muted);font-size:.88rem}
.files{padding:0 12px 12px;display:grid;gap:8px}
.file{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);min-width:0}
.ext{flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:.7rem;font-weight:700;color:#fff;background:#566;letter-spacing:.3px;overflow:hidden}
.ext img{width:100%;height:100%;object-fit:cover;display:block}
.ext.pdf{background:#c0392b}.ext.docx{background:#2b6cb0}.ext.xlsx{background:#2f855a}.ext.pptx{background:#c05621}.ext.img{background:#0b7f7a}.ext.zip{background:#6b46c1}
.file .inf{flex:1;min-width:0}
.file .fn{font-weight:500;overflow-wrap:anywhere;line-height:1.35}
.file .fm{font-size:.76rem;color:var(--muted)}
.file .acts{display:flex;gap:8px;flex:1 0 100%;flex-wrap:wrap}
.nofiles{color:var(--muted);font-size:.88rem;padding:2px 4px 4px}

/* homework */
.hws{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.hw{padding:14px 16px;display:grid;gap:8px;min-width:0;align-content:start}
.hw h3{font-size:1.05rem;overflow-wrap:anywhere}
.hw p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.hw img.pic{width:100%;max-height:220px;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:zoom-in;display:block}
.due{font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);justify-self:start}
.due.soon{background:var(--warn-soft);color:var(--warn)}.due.late{background:var(--bad-soft);color:var(--bad)}
.chip{font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);display:inline-flex;gap:6px;align-items:center;justify-self:start}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent));display:inline-block}
.admacts{display:flex;gap:6px;flex-wrap:wrap}
.addrow{margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap}
.hint{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.9rem}

.offbar{background:var(--warn-soft);color:var(--warn);font-size:.9rem;font-weight:500}.offbar .wrap{padding-block:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lnk{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font:inherit;font-size:inherit}
/* footer */
footer{background:var(--hero);color:var(--hero-ink);margin-top:10px}
footer .wrap{padding-block:26px 30px;display:grid;gap:12px}
footer h2{font-size:1.2rem}
footer p{margin:0;color:var(--hero-muted);font-size:.9rem}
.ct{display:flex;gap:10px;flex-wrap:wrap}
.ct .c{display:flex;gap:10px;align-items:center;border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:8px 12px;background:rgba(255,255,255,.06);min-width:0}
.ct .c small{color:var(--hero-muted);display:block;line-height:1.2}
.ct .c span{direction:ltr;unicode-bidi:embed;user-select:all;overflow-wrap:anywhere}
.ct a{color:var(--hero-ink);text-decoration:none;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:2px 10px;font-size:.84rem}
.ct button{border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--hero-ink);border-radius:8px;padding:2px 10px;font-size:.84rem}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(4,16,20,.6);z-index:50;display:grid;place-items:center;padding:16px;overflow-y:auto}
.sheet{width:100%;max-width:520px;max-height:calc(100% - 8px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);margin:auto}
.sheet h2{font-size:1.2rem;margin-bottom:12px}
.fld{display:grid;gap:4px;margin-bottom:12px}
.fld label{font-size:.86rem;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 12px;min-height:42px}
.fld textarea{min-height:96px;resize:vertical}
.fld small{color:var(--muted)}
.err{color:var(--bad);font-size:.88rem;min-height:1.2em;margin:0 0 8px}
.sheet .foot{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap;margin-top:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sw b{display:block}.sw small{color:var(--muted)}
.tg{flex:none;width:52px;height:30px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);position:relative;padding:0}
.tg::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s}
.tg[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.tg[aria-checked="true"]::after{background:var(--accent-ink);transform:translateX(-22px)}
.lst{display:grid;gap:8px;margin-bottom:12px}
.li{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.li span{flex:1;min-width:0;overflow-wrap:anywhere}
.toasts{position:fixed;z-index:60;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;justify-items:center;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;background:var(--hero);color:var(--hero-ink);border:1px solid var(--accent);border-radius:14px;padding:10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:min(440px,100%);animation:up .25s ease-out}
.toast.err{border-color:var(--bad)}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.lb-img{max-width:100%;max-height:calc(100vh - 80px);border-radius:12px;display:block;margin:auto}
@media (max-width:520px){.row2{grid-template-columns:1fr}.hero .row{gap:10px}.logo{width:50px;height:50px}.ticker .lb{padding:8px 11px}}
@media (prefers-reduced-motion:reduce){.tk-in{animation:none}.ecg path{animation:none;stroke-dashoffset:0}.ticker .vp{overflow-x:auto}.toast{animation:none}}

/* ===== أزرار بارزة: تتناوب بين الأزرق والأصفر ===== */
@keyframes swing-fill{
  0%,38%,100%{background-color:var(--blue);border-color:var(--yellow);color:var(--on-blue);box-shadow:0 4px 0 var(--blue-deep)}
  50%,88%{background-color:var(--yellow);border-color:var(--blue);color:var(--on-yellow);box-shadow:0 4px 0 var(--yellow-deep)}
}
@keyframes swing-line{
  0%,38%,100%{border-color:var(--blue);box-shadow:0 3px 0 var(--yellow)}
  50%,88%{border-color:var(--yellow);box-shadow:0 3px 0 var(--blue)}
}
@keyframes swing-hero{
  0%,38%,100%{border-color:var(--blue-hi);box-shadow:0 3px 0 var(--yellow-hi)}
  50%,88%{border-color:var(--yellow-hi);box-shadow:0 3px 0 var(--blue-hi)}
}
@keyframes swing-hero-fill{
  0%,38%,100%{background-color:var(--blue-hi);border-color:var(--yellow-hi);color:#04163a}
  50%,88%{background-color:var(--yellow-hi);border-color:var(--blue-hi);color:#1c1500}
}
.btn{border:2px solid var(--blue);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 16px;font-weight:700;min-height:42px;box-shadow:0 3px 0 var(--yellow);animation:swing-line 5s ease-in-out infinite;transition:transform .12s}
.btn:nth-child(even){animation-delay:-2.5s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(2px)}
.btn.sm{padding:4px 12px;min-height:34px;font-size:.86rem;border-radius:10px}
.btn.pri{background:var(--blue);color:var(--on-blue);border-color:var(--yellow);box-shadow:0 4px 0 var(--blue-deep);animation-name:swing-fill}
.btn.bad{color:var(--bad);border-color:var(--bad);box-shadow:0 3px 0 var(--bad-soft);animation:none}
.btn:disabled{animation-play-state:paused;opacity:.6;cursor:default}
.admbar{background:var(--hero);color:var(--hero-ink);border-bottom:3px solid var(--yellow-hi)}
.admbar .btn{background:var(--surface);border-color:var(--blue);color:var(--ink)}
.admbar .btn.pri{background:var(--blue);color:var(--on-blue)}
.ibtn{border:2px solid var(--blue-hi);background:rgba(255,255,255,.1);animation:swing-hero 5s ease-in-out infinite}
.ibtn:hover{background:rgba(255,255,255,.2)}
.seg{border:2px solid var(--line);border-radius:14px;gap:6px}
.seg button{border:2px solid transparent;color:var(--ink);font-weight:700;border-radius:10px;position:relative}
.seg button:not([aria-pressed="true"]):hover{border-color:var(--blue)}
.seg button[aria-pressed="true"]{border-color:var(--yellow);background:var(--blue);color:var(--on-blue);animation:swing-fill 5s ease-in-out infinite}
.tabs{border-bottom:0;gap:8px;padding:16px 2px 8px}
.tabs button{border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;border-radius:12px;padding:8px 16px}
.tabs button:not([aria-selected="true"]):hover{border-color:var(--blue)}
.tabs button[aria-selected="true"]{border-color:var(--yellow);background:var(--blue);color:var(--on-blue);animation:swing-fill 5s ease-in-out infinite}
.tg[aria-checked="true"]{background:var(--blue);border-color:var(--yellow)}
.tg[aria-checked="true"]::after{background:var(--yellow)}
/* علامة جديد فوق الزر */
.mark{position:absolute;top:-11px;inset-inline-start:6px;z-index:2;background:var(--bad);color:#fff;font:700 .68rem/1 var(--f-body);padding:4px 9px;border-radius:99px;border:2px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.3);animation:markpulse 1.6s ease-in-out infinite;pointer-events:none;white-space:nowrap}
@keyframes markpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.newtag{background:var(--bad);color:#fff;font-size:.72rem;font-weight:700;padding:2px 10px;border-radius:99px;animation:markpulse 1.6s ease-in-out infinite}
.notices .card[data-act]{cursor:pointer}
/* إشعارات داخل الصفحة */
.notifs{position:fixed;z-index:70;inset-inline:0;top:calc(10px + env(safe-area-inset-top,0px));display:grid;gap:10px;justify-items:center;padding:0 max(12px,env(safe-area-inset-left,0px)) 0 max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.nf{pointer-events:auto;width:min(460px,100%);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);color:var(--ink);border:2px solid var(--blue);border-radius:16px;padding:12px 14px 14px;box-shadow:0 12px 34px rgba(0,0,0,.3),0 4px 0 var(--yellow);position:relative;overflow:hidden;animation:nfin .35s cubic-bezier(.2,.9,.3,1.2)}
.nf .ic{width:42px;height:42px;border-radius:12px;background:var(--blue);color:var(--on-blue);border:2px solid var(--yellow);display:grid;place-items:center}
.nf .ic svg{width:22px;height:22px}

.nf .x{border:2px solid var(--line);background:transparent;border-radius:10px;width:34px;height:34px;font-size:1.2rem;line-height:1;padding:0}
.nf .bar{position:absolute;inset-inline:0;bottom:0;height:5px;background:var(--yellow);transform-origin:right;animation:nfbar var(--t,9000ms) linear forwards}
@keyframes nfbar{to{transform:scaleX(0)}}
@keyframes nfin{from{transform:translateY(-26px);opacity:0}to{transform:none;opacity:1}}
@keyframes nfout{to{transform:translateY(-22px);opacity:0}}
.nf.out{animation:nfout .3s forwards}
.pushbar{background:var(--surface);border-bottom:2px solid var(--blue)}
.pushbar .wrap{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding-block:10px}
.pushbar span{flex:1;min-width:200px;font-weight:600}
/* بطاقة المطوّر */
footer .wrap{padding-block:28px 26px;gap:16px}
.dev{border:2px solid rgba(255,255,255,.16);border-radius:22px;padding:18px;background:rgba(255,255,255,.04);display:grid;gap:16px}

.dev small{color:var(--yellow-hi);font-weight:700;letter-spacing:.3px}
.dev h2{font-size:1.5rem;line-height:1.3}
.dev .dev-id p{margin-top:2px}
.dev-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;border:2px solid rgba(255,255,255,.14);border-radius:16px;padding:12px;background:rgba(255,255,255,.05);min-width:0}
.dl .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff}
.dl .ico svg{width:26px;height:26px}
.dl.wa .ico{background:#1fa855}
.dl.ig .ico{background:linear-gradient(45deg,#f9a03c,#dd2a7b 55%,#5b51d8)}
.dl .tx{min-width:0}
.dl .tx small{display:block;color:var(--hero-muted);font-weight:600}
.dl .val{display:block;direction:ltr;text-align:right;unicode-bidi:embed;font-weight:700;font-size:1.08rem;user-select:all;overflow-wrap:anywhere}
.dl .ac{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.dbtn{flex:1;min-width:110px;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--blue-hi);background:transparent;color:var(--hero-ink);border-radius:12px;padding:8px 14px;font-weight:700;min-height:42px;animation:swing-hero 5s ease-in-out infinite}
.dbtn.fill{background:var(--blue-hi);color:#04163a;border-color:var(--yellow-hi);animation-name:swing-hero-fill}
.dbtn.alt{animation-delay:-2.5s}
.legal{text-align:center;color:var(--hero-muted);font-size:.82rem}
@media (prefers-reduced-motion:reduce){.btn,.btn.pri,.ibtn,.seg button,.tabs button,.dbtn,.mark,.newtag,.nf,.nf .bar{animation:none!important}.nf .bar{display:none}}
@media (min-width:700px){.notifs{justify-items:end;top:calc(126px + env(safe-area-inset-top,0px))}}

/* ===== لافتة أخبار الفرع بالأحمر ===== */
.ticker{border-color:#d8232a}
.ticker .lb{background:#d8232a;color:#fff;font-weight:700;gap:8px}
.ticker .lb::before{content:"";width:9px;height:9px;border-radius:50%;background:#fff;flex:none;animation:markpulse 1.4s ease-in-out infinite}
.tk-set span::after{background:#ff5a5f}
@media (prefers-reduced-motion:reduce){.ticker .lb::before{animation:none}}
/* ===== التحكم بلون الأزرار (يحدده الأدمن) ===== */
:root[data-btn="blue"]{--yellow:var(--blue);--yellow-deep:var(--blue-deep);--on-yellow:var(--on-blue);--yellow-hi:var(--blue-hi)}
:root[data-btn="yellow"]{--blue:var(--yellow);--blue-deep:var(--yellow-deep);--on-blue:var(--on-yellow);--blue-hi:var(--yellow-hi)}
:root[data-btn="fixed"] .btn,:root[data-btn="fixed"] .ibtn,:root[data-btn="fixed"] .seg button,:root[data-btn="fixed"] .tabs button,:root[data-btn="fixed"] .dbtn{animation:none!important}
:root[data-btn="fixed"] .btn.pri,:root[data-btn="fixed"] .tabs button[aria-selected="true"],:root[data-btn="fixed"] .seg button[aria-pressed="true"]{border-color:var(--blue-deep)}
:root[data-btn="blue"] .btn,:root[data-btn="blue"] .ibtn,:root[data-btn="blue"] .seg button,:root[data-btn="blue"] .tabs button,:root[data-btn="blue"] .dbtn,
:root[data-btn="yellow"] .btn,:root[data-btn="yellow"] .ibtn,:root[data-btn="yellow"] .seg button,:root[data-btn="yellow"] .tabs button,:root[data-btn="yellow"] .dbtn{animation:none!important}
:root[data-btn="blue"] .btn.pri,:root[data-btn="blue"] .tabs button[aria-selected="true"],:root[data-btn="blue"] .seg button[aria-pressed="true"]{border-color:var(--blue-deep)}
:root[data-btn="yellow"] .btn.pri,:root[data-btn="yellow"] .tabs button[aria-selected="true"],:root[data-btn="yellow"] .seg button[aria-pressed="true"]{border-color:var(--yellow-deep)}

.vw-body{flex:1;min-height:0;overflow:auto;direction:ltr;padding:12px;-webkit-overflow-scrolling:touch}
.vw-msg{direction:rtl;text-align:center;color:var(--muted);padding:40px 16px;display:grid;gap:14px;justify-items:center}
.pages{margin:0 auto}
.pg{background:#fff;margin:0 auto 12px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.pg canvas{display:block;width:100%;height:100%}
.doc{direction:rtl;background:#fff;color:#111;max-width:860px;margin:0 auto;padding:22px 20px;border-radius:8px;overflow-wrap:anywhere;line-height:1.8}
.doc img{max-width:100%;height:auto}
.doc table{border-collapse:collapse;max-width:100%}
.doc td,.doc th{border:1px solid #bbb;padding:4px 8px;vertical-align:top}
.doc.xl{max-width:none;overflow:auto;padding:8px;line-height:1.5}
.doc pre{white-space:pre-wrap;margin:0;font:inherit}
.sheets{direction:rtl;display:flex;gap:6px;flex-wrap:wrap;margin:0 auto 10px}
.vw-img{display:block;max-width:100%;margin:0 auto;border-radius:8px}
/* ===== مشاركة الصور ===== */
.pcard{padding:14px 16px}
.pcard p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.ph{position:relative;padding:0;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface2);aspect-ratio:1;display:block;width:100%}
.ph:hover{border-color:var(--blue)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .pn{position:absolute;inset-inline:0;bottom:0;padding:18px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;font-size:.8rem;font-weight:600;text-align:start;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ph .newtag{position:absolute;top:6px;inset-inline-start:6px}
.al{position:fixed;inset:0;z-index:45;background:#05100f;color:#fff;display:flex;flex-direction:column}
.al-top{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.al-top .sp{flex:1}
.al-cnt{font-variant-numeric:tabular-nums;font-weight:700;direction:ltr;unicode-bidi:isolate}
.al a.btn{text-decoration:none;display:inline-flex;align-items:center}
.al-stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;touch-action:pan-y;user-select:none;overflow:hidden}
.al-stage img{max-width:100%;max-height:100%;object-fit:contain;display:block;-webkit-user-drag:none}
.al-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:64px;border-radius:14px;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.45);color:#fff;font-size:2rem;line-height:1;padding:0;display:grid;place-items:center;z-index:2}
.al-nav.prev{right:8px}.al-nav.next{left:8px}
.al-nav:disabled{opacity:.25}
.al-info{padding:8px 16px;text-align:center;display:grid;gap:2px}
.al-info b{font-size:1.05rem}
.al-info small{color:#a9c4c2}
.al-info .cap{overflow-wrap:anywhere}
.al-strip{display:flex;gap:6px;overflow-x:auto;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.al-strip button{flex:none;width:62px;height:62px;border-radius:10px;border:3px solid transparent;padding:0;overflow:hidden;background:#13292a;opacity:.6}
.al-strip button.on{border-color:var(--yellow-hi);opacity:1}
.al-strip img{width:100%;height:100%;object-fit:cover;display:block}
.glist{display:grid;gap:6px;max-height:42vh;overflow:auto;margin-bottom:10px}
.gi{text-align:start;border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 14px;font-weight:600}
.gi[aria-pressed="true"]{border-color:var(--blue);background:var(--blue);color:var(--on-blue)}
.pprev{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-bottom:12px}
.pprev img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.prog{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:6px 0 10px}
.prog i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}
/* جولة الميزات */
.tour-ic{width:60px;height:60px;border-radius:18px;background:var(--blue);color:var(--on-blue);border:3px solid var(--yellow);display:grid;place-items:center;margin-bottom:12px}
.tour-ic svg{width:30px;height:30px}

.dots i.on{background:var(--blue);width:22px;border-radius:99px}

<body>
<div id="hdr"></div>
<div id="adm"></div>
<div id="pushbar"></div>
<div class="wrap">
  <section class="notices" id="notices" aria-label="التنبيهات والملاحظات"></section>
  <div id="tick"></div>
  <div class="controls" id="controls"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <main id="main"></main>
</div>
<footer id="foot"></footer>
<div id="viewer"></div>
<div id="album"></div>
<div id="modal"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="notifs" id="notifs" aria-live="polite"></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const DAY_ORDER=[6,0,1,2,3,4];
const COLORS=['#0b7f7a','#2b6cb0','#c05621','#6b46c1','#b83280','#2f855a','#b7791f','#c53030'];
const COURSES={c1:'الكورس الأول',c2:'الكورس الثاني'};
const LEVELS={note:'ملاحظة',alert:'تنبيه',urgent:'مهم جداً'};
const OK_EXT=['pdf','docx','xlsx','pptx','png','jpg','jpeg','webp','gif','zip','txt','csv','md','json'];
const NATIVE={pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif'};
const MIME={pdf:'application/pdf',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation',zip:'application/zip',txt:'text/plain',csv:'text/csv',md:'text/markdown',json:'application/json'};
const EMPTY=()=>({pw:'',btn:'swing',btnColor:'',students:[],ticker:[],notices:[],hw:[],courses:{c1:{subjects:[],slots:[]},c2:{subjects:[],slots:[]}},rev:0});

let S=EMPTY(), FILES=[], PHOTOS=[], VAPID='', lastVer='', lastSaved=null, busy=0;
let ui=Object.assign({course:'c1',tab:'schedule',last:'schedule'},ls.get('mi_ui',{}));
if(!['schedule','subjects','hw','photos'].includes(ui.tab))ui.tab='schedule';
let me=ls.get('mi_me',null), psec=ls.get('mi_psec',{}), photoBase=+(ls.get('mi_viewed',{}).photos)||0;
let set=Object.assign({theme:'auto',sound:true,notif:false},ls.get('mi_set',{}));
let token=ls.get('mi_tok',null);
let isAdmin=false; try{isAdmin=sessionStorage.getItem('mi_adm')==='1'&&!!token&&token.exp>Date.now()}catch(e){}
let first={state:true,files:true};
let dataReady=false,viewed=ls.get('mi_viewed',{});
let netDown=false, cachedAt=0, offIds=new Set();

/* ---------- theme / sound / toast ---------- */
function applyTheme(){const r=document.documentElement;if(set.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',set.theme)}
function isDark(){return set.theme==='dark'||(set.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches)}
function saveSet(){ls.set('mi_set',set)}
applyTheme();
let actx=null;
function unlock(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
addEventListener('pointerdown',unlock,{passive:true});addEventListener('keydown',unlock);
function alarm(){
  if(!set.sound||!actx)return;
  try{const t=actx.currentTime;
    [[0,880],[.24,880],[.48,1175],[1,880],[1.24,880],[1.48,1175]].forEach(([d,f])=>{
      const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(.3,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.21);
      o.connect(g);g.connect(actx.destination);o.start(t+d);o.stop(t+d+.23)});
  }catch(e){}
}
function toast(msg,kind){const el=document.createElement('div');el.className='toast'+(kind==='err'?' err':'');el.textContent=msg;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),kind==='err'?6000:4200)}
const NF_ICON={
  notice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
  hw:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  schedule:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  doctor:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  subject:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5V21h16"/></svg>',
  file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 18v-6m-3 3 3 3 3-3"/></svg>',
  photo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
  news:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M16 8a5 5 0 0 1 0 8"/></svg>'
};
function pushNotif(n){
  const box=$('#notifs');if(!box)return;
  while(box.children.length>=4)box.firstChild.remove();
  const el=document.createElement('div');el.className='nf';el.setAttribute('role','status');
  const T=9000;el.style.setProperty('--t',T+'ms');
  el.innerHTML='<div class="ic">'+(NF_ICON[n.kind]||NF_ICON.news)+'</div><div><b>'+esc(n.title)+'</b>'+(n.body?'<p>'+esc(n.body)+'</p>':'')+(n.tab?'<div class="acts"><button class="btn pri sm" type="button">عرض</button></div>':'')+'</div><button class="x" type="button" aria-label="إغلاق">×</button><i class="bar"></i>';
  const close=()=>{if(!el.isConnected)return;el.classList.add('out');setTimeout(()=>el.remove(),320)};
  setTimeout(close,T);
  el.querySelector('.x').onclick=close;
  const go=el.querySelector('.acts .btn');if(go)go.onclick=()=>{gotoTarget(n);close()};
  box.appendChild(el);
}
function gotoTarget(n){
  if(n.course&&COURSES[n.course])ui.course=n.course;
  if(n.tab&&n.tab!=='notices'&&['schedule','subjects','hw','photos'].includes(n.tab)){if(n.tab==='photos'&&ui.tab!=='photos'){ui.last=ui.tab;photoBase=+viewed.photos||0}ui.tab=n.tab}
  ls.set('mi_ui',ui);render();
  const y=n.tab==='notices'?0:Math.max(0,($('#controls').getBoundingClientRect().top+scrollY)-12);
  try{scrollTo({top:y,behavior:'smooth'})}catch(e){scrollTo(0,y)}
}
function showUpdates(list){
  if(!list.length)return;
  list.slice(0,3).forEach((n,i)=>setTimeout(()=>pushNotif(n),i*350));
  if(list.length>3)setTimeout(()=>pushNotif({kind:'news',title:'و'+(list.length-3)+' تحديثات أخرى',body:'راجع علامات «جديد» فوق الأزرار'}),1100);
  alarm();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}
function notifyUser(title,body,meta){showUpdates([Object.assign({kind:'news',title,body},meta||{})])}

/* ---------- متابعة ما شاهده الطالب (علامة «جديد» فوق الأزرار) ---------- */
const TABS=[['schedule','جدول المحاضرات'],['subjects','المواد والملفات'],['hw','الواجبات']];
const hashS=str=>{let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return String(h)};
const vKey=(c,t)=>c?c+':'+t:t;
function secSig(c,t){
  const co=(S.courses&&S.courses[c])||{subjects:[],slots:[]};
  if(t==='schedule')return JSON.stringify([co.slots,co.subjects.map(s=>[s.id,s.name,s.doctor])]);
  if(t==='subjects')return JSON.stringify([co.subjects,FILES.filter(f=>f.course===c).map(f=>f.id)]);
  if(t==='hw')return JSON.stringify((S.hw||[]).filter(w=>w.course===c));
  if(t==='notices')return JSON.stringify(S.notices||[]);
  return '';
}
const allKeys=()=>{const k=[['','notices'],['','photos']];Object.keys(COURSES).forEach(c=>TABS.forEach(t=>k.push([c,t[0]])));return k};
function saveViewed(){ls.set('mi_viewed',viewed)}
const photoMax=()=>PHOTOS.reduce((m,p)=>Math.max(m,+p.at||0),0);
const sigOf=(c,t)=>t==='photos'?String(photoMax()):hashS(secSig(c,t));
function hasNew(c,t){const k=vKey(c,t);if(!dataReady||!(k in viewed))return false;if(t==='photos')return photoMax()>+viewed[k];return viewed[k]!==sigOf(c,t)}
function courseNew(c){return TABS.some(t=>hasNew(c,t[0]))}

function markAllViewed(){if(!dataReady)return;allKeys().forEach(([c,t])=>{const k=vKey(c,t);if(t==='photos'&&+viewed[k]>photoMax())return;viewed[k]=sigOf(c,t)});saveViewed()}
function ensureBaseline(){let ch=false;allKeys().forEach(([c,t])=>{const k=vKey(c,t);if(!(k in viewed)){viewed[k]=sigOf(c,t);ch=true}});if(ch)saveViewed()}

async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mi|'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'x:'+btoa(unescape(encodeURIComponent(s)))}}

const subOf=id=>cur().subjects.find(s=>s.id===id);
const toMin=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(t||'');return m?(+m[1])*60+(+m[2]):0};
function t12(t){const m=toMin(t),h=Math.floor(m/60),mm=String(m%60).padStart(2,'0');return (h%12||12)+':'+mm+' '+(h<12?'ص':'م')}
function fsize(n){if(!n)return '';return n<1048576?Math.max(1,Math.round(n/1024))+' ك.ب':(n/1048576).toFixed(1)+' م.ب'}
const extOf=n=>(String(n).split('.').pop()||'').toLowerCase();
function extCls(e){return e==='pdf'?'pdf':e==='docx'?'docx':e==='xlsx'||e==='csv'?'xlsx':e==='pptx'?'pptx':['png','jpg','jpeg','webp','gif'].includes(e)?'img':e==='zip'?'zip':''}

const API='/api',JH={'content-type':'application/json'};

function dropAdmin(){isAdmin=false;token=null;ls.set('mi_tok',null);try{sessionStorage.removeItem('mi_adm')}catch(e){}}
async function api(path,opt){
  opt=opt||{};
  const r=await fetch(API+path,Object.assign({},opt,{headers:Object.assign({},authH(),opt.headers||{})}));
  let d=null;try{d=await r.json()}catch(e){}
  if(r.status===401&&token){dropAdmin();render();toast('انتهت جلسة الأدمن، سجّل الدخول من جديد','err')}
  if(!r.ok)throw new Error((d&&d.error)||'تعذر الاتصال بالخادم');
  return d;
}
const norm=st=>{const s=Object.assign(EMPTY(),st||{});s.courses=Object.assign({c1:{subjects:[],slots:[]},c2:{subjects:[],slots:[]}},s.courses||{});for(const k of['c1','c2']){s.courses[k].subjects=s.courses[k].subjects||[];s.courses[k].slots=s.courses[k].slots||[]}if(!Array.isArray(s.students))s.students=[];if(!['swing','blue','yellow','fixed'].includes(s.btn))s.btn='swing';if(!/^#[0-9a-f]{6}$/i.test(s.btnColor||''))s.btnColor='';return s};
const onlyMeta=(a,b)=>{const f=x=>{const o=Object.assign({},x);delete o.rev;delete o.btn;delete o.btnColor;delete o.students;return JSON.stringify(o)};return f(a)===f(b)};
function snapshot(){lastSaved=JSON.parse(JSON.stringify(S))}
function diffList(a,b){
  const out=[];
  const idsA=new Set((a.notices||[]).map(i=>i.id));
  (b.notices||[]).forEach(n=>{
    if(!idsA.has(n.id))out.push({kind:'notice',title:'تنبيه جديد',body:String(n.text||'').slice(0,90),tab:'notices'});
    else{const o=(a.notices||[]).find(x=>x.id===n.id);if(JSON.stringify(o)!==JSON.stringify(n))out.push({kind:'notice',title:'تعديل على تنبيه',body:String(n.text||'').slice(0,90),tab:'notices'})}
  });
  Object.keys(COURSES).forEach(c=>{
    const ca=(a.courses&&a.courses[c])||{subjects:[],slots:[]},cb=(b.courses&&b.courses[c])||{subjects:[],slots:[]},cn=COURSES[c];
    const m=new Map((ca.subjects||[]).map(s=>[s.id,s]));
    (cb.subjects||[]).forEach(s=>{
      const o=m.get(s.id);
      if(!o)out.push({kind:'subject',title:'مادة جديدة',body:s.name+(s.doctor?' ('+s.doctor+')':'')+' · '+cn,course:c,tab:'subjects'});
      else{
        if(o.doctor!==s.doctor)out.push({kind:'doctor',title:'تغيير الدكتور',body:s.name+': من '+(o.doctor||'—')+' إلى '+(s.doctor||'—'),course:c,tab:'schedule'});
        if(o.name!==s.name)out.push({kind:'subject',title:'تعديل اسم مادة',body:o.name+' ← '+s.name,course:c,tab:'subjects'});
      }
    });
    if(JSON.stringify(ca.slots||[])!==JSON.stringify(cb.slots||[]))out.push({kind:'schedule',title:'تحديث الجدول',body:cn,course:c,tab:'schedule'});
  });
  const ha=new Map((a.hw||[]).map(w=>[w.id,w]));
  (b.hw||[]).forEach(w=>{const o=ha.get(w.id);
    if(!o)out.push({kind:'hw',title:'واجب جديد',body:w.title,course:w.course,tab:'hw'});
    else if(JSON.stringify(o)!==JSON.stringify(w))out.push({kind:'hw',title:'تعديل على واجب',body:w.title,course:w.course,tab:'hw'});
  });
  if(JSON.stringify(a.ticker||[])!==JSON.stringify(b.ticker||[]))out.push({kind:'news',title:'خبر جديد في الشريط',body:(b.ticker||[])[0]||''});
  return out;
}
function diffMsg(a,b){
  const l=diffList(a,b);if(!l.length)return null;
  if(l.length===1)return {title:l[0].title,body:l[0].body,tab:l[0].tab||'',course:l[0].course||''};
  const t=[...new Set(l.map(x=>x.title))].slice(0,3).join('، ');
  return {title:'عدة تحديثات جديدة',body:t,tab:l[0].tab||'',course:l[0].course||''};
}
function diffAlert(a,b){const l=diffList(a,b);showUpdates(l.length?l:[{kind:'news',title:'تحديث جديد في الصفحة',body:''}])}
let wq=Promise.resolve();
function commit(msg){
  const note=lastSaved?diffMsg(lastSaved,S):null;
  S.rev=Date.now();markAllViewed();render();busy++;
  wq=wq.then(async()=>{const r=await api('/state',{method:'PUT',headers:JH,body:JSON.stringify({state:S,notify:note})});lastVer=r.ver;snapshot();if(msg)toast(msg)})
    .catch(e=>toast(e.message||'تعذر الحفظ','err')).then(()=>{busy--});
  return wq;
}
async function load(initial){
  const d=await api('/state'+(lastVer&&!initial?'?ver='+encodeURIComponent(lastVer):''));
  if(d.vapid)VAPID=d.vapid;
  if(d.unchanged)return;
  const prev=S,prevFiles=FILES,prevPhotos=PHOTOS;
  S=norm(d.state);FILES=d.files||[];PHOTOS=d.photos||[];lastVer=d.ver;dataReady=true;
  cachedAt=Date.now();ls.set('mi_cache',{state:d.state,files:d.files||[],photos:PHOTOS,at:cachedAt});
  if(initial){ensureBaseline();const ns=newSections();if(ns.length){const lab=[...new Set(ns.map(x=>SEC_LABEL[x.t]+(x.c?' ('+COURSES[x.c]+')':'')))];showUpdates([{kind:'news',title:'تحديثات جديدة منذ زيارتك الأخيرة',body:lab.join('، '),course:ns[0].c||'',tab:ns[0].t}])}ls.set('mi_seen',S.rev)}
  else{
    const nf=FILES.filter(f=>!prevFiles.some(p=>p.id===f.id));
    const L=diffList(prev,S);
    if(nf.length)L.unshift({kind:'file',title:'ملف جديد',body:nf[0].name+(nf.length>1?' و'+(nf.length-1)+' غيره':''),course:nf[0].course,tab:'subjects'});
    const np=PHOTOS.filter(p=>!prevPhotos.some(x=>x.id===p.id)&&!isMine(p));
    if(np.length)L.push({kind:'photo',title:np.length>1?'صور جديدة':'صورة جديدة',body:np.length>1?np.length+' صور من '+[...new Set(np.map(nameOf))].slice(0,3).join('، '):'شاركها '+nameOf(np[0]),tab:'photos'});
    if(L.length)showUpdates(L);else if(S.rev!==prev.rev&&!onlyMeta(prev,S))diffAlert(prev,S);
    ls.set('mi_seen',S.rev);
  }
  snapshot();render();prefetch();
}
function isMine(p){return isAdmin?p.sid==='admin':!!(me&&p.sid===me.id)}
function nameOf(p){if(p.sid==='admin')return 'الأدمن';const s=(S.students||[]).find(x=>x.id===p.sid);return s?s.name:(p.name||'—')}

async function storeBlob(file){
  if(file.size>5*1048576)throw new Error('الحجم الأقصى للملف 5 م.ب');
  const meta={name:file.name,mime:file.type||'application/octet-stream'};
  const r=await api('/files',{method:'POST',headers:{'x-meta':encodeURIComponent(JSON.stringify(meta))},body:file});
  return {url:r.url};
}
async function addFile(sub,file){
  if(file.size>5*1048576)throw new Error('«'+file.name+'» أكبر من 5 م.ب');
  const meta={name:file.name,mime:file.type||'application/octet-stream',course:ui.course,sub};
  const r=await api('/files',{method:'POST',headers:{'x-meta':encodeURIComponent(JSON.stringify(meta))},body:file});
  FILES=FILES.concat(r.file);lastVer=r.ver;render();
}
async function delFile(f){const r=await api('/files/'+f.id,{method:'DELETE'});FILES=FILES.filter(x=>x.id!==f.id);lastVer=r.ver;render()}

/* ---------- الإشعارات الخارجية (Web Push) ---------- */
const urlB64=s=>{const p='='.repeat((4-s.length%4)%4);const r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
async function enablePush(){
  if(!('serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window))throw new Error('المتصفح لا يدعم الإشعارات. في الآيفون أضف الصفحة إلى الشاشة الرئيسية أولاً');
  if(!VAPID)throw new Error('تعذر الاتصال بالخادم، حاول بعد قليل');
  const p=await Notification.requestPermission();if(p!=='granted')throw new Error('لم يُمنح إذن الإشعارات. فعّله من إعدادات المتصفح');
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64(VAPID)});
  await api('/push',{method:'POST',headers:JH,body:JSON.stringify(sub)});
}
async function disablePush(){try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(sub){await api('/push',{method:'DELETE',headers:JH,body:JSON.stringify({endpoint:sub.endpoint})});await sub.unsubscribe()}}catch(e){}}

addEventListener('keydown',e=>{

  else if(AL&&!mo&&e.key==='ArrowLeft')albumGo(1);else if(AL&&!mo&&e.key==='ArrowRight')albumGo(-1);

function fieldHTML(f,i){
  const id='f'+i,v=f.value==null?'':f.value;let inp='';
  if(f.type==='textarea')inp='<textarea id="'+id+'">'+esc(v)+'</textarea>';
  else if(f.type==='select')inp='<select id="'+id+'">'+f.options.map(o=>'<option value="'+esc(o[0])+'"'+(o[0]===v?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>';
  else if(f.type==='file')inp='<input id="'+id+'" type="file"'+(f.accept?' accept="'+f.accept+'"':'')+(f.multiple?' multiple':'')+'>';
  else inp='<input id="'+id+'" type="'+(f.type||'text')+'" value="'+esc(v)+'"'+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+'>';
  return '<div class="fld"><label for="'+id+'">'+esc(f.label)+'</label>'+inp+(f.hint?'<small>'+esc(f.hint)+'</small>':'')+'</div>';
}
function form(o){
  const rows=[];let i=0,buf=[];
  o.fields.forEach(f=>{const h=fieldHTML(f,i++);if(f.half){buf.push(h);if(buf.length===2){rows.push('<div class="row2">'+buf.join('')+'</div>');buf=[]}}else{if(buf.length){rows.push('<div class="row2">'+buf.join('')+'</div>');buf=[]}rows.push(h)}});
  if(buf.length)rows.push('<div class="row2">'+buf.join('')+'</div>');

      const vals={};o.fields.forEach((f,k)=>{const el=sh.querySelector('#f'+k);vals[f.k]=f.type==='file'?(f.multiple?[...el.files]:el.files[0]):el.value.trim()});
      for(const f of o.fields){if(f.req&&(!vals[f.k]||(Array.isArray(vals[f.k])&&!vals[f.k].length))){sh.querySelector('#ferr').textContent='الحقل مطلوب: '+f.label;return}}
      const b=sh.querySelector('#fsave');b.disabled=true;b.textContent='جارٍ الحفظ…';
      try{await o.onSave(vals);closeModal()}catch(e){sh.querySelector('#ferr').textContent=(e&&e.message)||'حدث خطأ';b.disabled=false;b.textContent=o.save||'حفظ'}
    };
    sh.querySelector('#fsave').onclick=run;
    sh.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='file'){e.preventDefault();run()}});

async function toJpeg(file,maxSide,q,maxBytes){
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}
  catch(e){bmp=await new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>res(im);im.onerror=()=>rej(new Error('تعذر قراءة الصورة'));im.src=u})}
  const w0=bmp.width||bmp.naturalWidth,h0=bmp.height||bmp.naturalHeight;
  let sc=Math.min(1,maxSide/Math.max(w0,h0));
  for(let t=0;t<7;t++){
    const w=Math.max(1,Math.round(w0*sc)),h=Math.max(1,Math.round(h0*sc));
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(bmp,0,0,w,h);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));
    if(blob&&blob.size<=maxBytes){if(bmp.close)bmp.close();return {blob,w,h}}
    q=Math.max(.5,q-.08);if(t>=2)sc*=.85;
  }
  throw new Error('تعذر تصغير الصورة');
}

const SAFE_TAGS=new Set('P,BR,STRONG,B,EM,I,U,S,SUB,SUP,H1,H2,H3,H4,H5,H6,UL,OL,LI,TABLE,THEAD,TBODY,TFOOT,TR,TD,TH,A,IMG,BLOCKQUOTE,SPAN,DIV,PRE,CODE,CAPTION,COL,COLGROUP'.split(','));
function cleanHTML(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const walk=node=>{[...node.childNodes].forEach(ch=>{
    if(ch.nodeType===3)return;
    if(ch.nodeType!==1){ch.remove();return}
    if(!SAFE_TAGS.has(ch.tagName)){
      if(/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|LINK|META|FORM|INPUT|BUTTON|SVG|MATH|TEMPLATE|NOSCRIPT|TEXTAREA|SELECT)$/.test(ch.tagName)){ch.remove();return}
      walk(ch);ch.replaceWith(...ch.childNodes);return}
    [...ch.attributes].forEach(a=>{const n=a.name.toLowerCase();
      const ok=(n==='href'&&/^(https?:|mailto:|#)/i.test(a.value))||(n==='src'&&ch.tagName==='IMG'&&/^data:image\/(png|jpe?g|gif|webp);/i.test(a.value))||['colspan','rowspan','alt'].includes(n);
      if(!ok)ch.removeAttribute(a.name)});
    if(ch.tagName==='A'){ch.setAttribute('target','_blank');ch.setAttribute('rel','noopener noreferrer')}
    if(/^(P|H[1-6]|LI|TD|TH|BLOCKQUOTE)$/.test(ch.tagName))ch.setAttribute('dir','auto');
    walk(ch);
  })};
  walk(doc.body);return doc.body.innerHTML;
}

  try{
    if(cls==='img'){
      body.innerHTML='<img class="vw-img" alt="" src="'+esc('/api/files/'+f.id)+'">';
      const im=body.firstChild;im.onerror=()=>msg('الصورة غير محفوظة على جهازك. اتصل بالإنترنت لعرضها مرة واحدة.');return;
    }
    if(e==='pptx'||e==='zip'){msg('هذا النوع من الملفات لا يمكن عرضه داخل الصفحة، يمكنك تنزيله وفتحه على جهازك.',true);return}
    let buf;
    try{buf=await fileBuf(f)}catch(er){msg('هذا الملف غير محفوظ على جهازك. اتصل بالإنترنت لعرضه أول مرة، وبعدها يبقى متاحاً بدون إنترنت.');return}
    if(!live())return;
    refreshOff();
    if(e==='pdf'){await showPdf(buf,body,tk,msg);return}
    if(e==='docx'){
      await loadScript('/vendor/mammoth.browser.min.js');
      const r=await window.mammoth.convertToHtml({arrayBuffer:buf});if(!live())return;
      body.innerHTML='<div class="doc">'+(cleanHTML(r.value)||'<p>الملف فارغ</p>')+'</div>';return;
    }
    if(e==='xlsx'){
      await loadScript('/vendor/xlsx.full.min.js');
      const wb=window.XLSX.read(buf,{type:'array'});if(!live())return;
      const draw=i=>{
        const ws=wb.Sheets[wb.SheetNames[i]];let note='';
        if(ws['!ref']){const rg=window.XLSX.utils.decode_range(ws['!ref']);if(rg.e.r>1500){rg.e.r=1500;note='<p>تم عرض أول 1500 صف فقط.</p>'}ws['!ref']=window.XLSX.utils.encode_range(rg)}
        const html=window.XLSX.utils.sheet_to_html(ws,{header:'',footer:''});
        body.innerHTML=(wb.SheetNames.length>1?'<div class="sheets">'+wb.SheetNames.map((n,k)=>'<button class="btn sm'+(k===i?' pri':'')+'" data-s="'+k+'">'+esc(n)+'</button>').join('')+'</div>':'')+'<div class="doc xl">'+note+cleanHTML(html)+'</div>';
      };
      body.onclick=ev=>{const b=ev.target.closest('[data-s]');if(b)draw(+b.dataset.s)};
      draw(0);return;
    }
    const txt=new TextDecoder('utf-8').decode(buf).slice(0,500000);
    body.innerHTML='<div class="doc"><pre dir="auto"></pre></div>';body.querySelector('pre').textContent=txt;
  }catch(er){msg('تعذر عرض الملف هنا. جرّب التنزيل.',true)}
}
async function showPdf(buf,body,tk,msg){
  try{await loadScript('/vendor/pdf.min.js')}catch(e){msg('تعذر تحميل أداة عرض PDF. اتصل بالإنترنت مرة واحدة ثم ستعمل بدون إنترنت.',true);return}
  const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc='/vendor/pdf.worker.min.js';
  const doc=await lib.getDocument({data:new Uint8Array(buf)}).promise;
  if(VW!==tk)return;
  const first=await doc.getPage(1),v1=first.getViewport({scale:1});
  let z=1,io=null;
  const vz=$('#vz');
  const build=()=>{
    if(io)io.disconnect();
    const w=Math.max(260,Math.min(body.clientWidth-24,900))*z;
    body.innerHTML='<div class="pages" style="width:'+w+'px"></div>';
    const box=body.firstChild;
    for(let n=1;n<=doc.numPages;n++){const d=document.createElement('div');d.className='pg';d.dataset.n=n;d.style.aspectRatio=v1.width+'/'+v1.height;box.appendChild(d)}
    io=new IntersectionObserver(es=>es.forEach(en=>{
      if(!en.isIntersecting)return;const d=en.target;io.unobserve(d);
      doc.getPage(+d.dataset.n).then(pg=>{
        const v0=pg.getViewport({scale:1}),dpr=Math.min(window.devicePixelRatio||1,2),sc=w/v0.width*dpr,vp=pg.getViewport({scale:sc});
        const cv=document.createElement('canvas');cv.width=Math.floor(vp.width);cv.height=Math.floor(vp.height);d.style.aspectRatio=v0.width+'/'+v0.height;
        return pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise.then(()=>{d.appendChild(cv)});
      }).catch(()=>{});
    }),{root:body,rootMargin:'700px 0px'});
    box.querySelectorAll('.pg').forEach(d=>io.observe(d));
  };
  vz.innerHTML='<button class="btn sm" data-z="-">−</button> <button class="btn sm" data-z="+">+</button>';
  vz.onclick=ev=>{const b=ev.target.closest('[data-z]');if(!b)return;z=Math.max(.6,Math.min(3,z+(b.dataset.z==='+'?.4:-.4)));build()};
  build();
}

 ['schedule','الجدول والكورسات','اختر الكورس الأول أو الثاني من الأزرار البارزة.',['جدول الأيام مع اسم المادة والدكتور والقاعة','بطاقة «المحاضرة القادمة» والمحاضرة الجارية الآن','أي تغيير بالجدول أو بالدكتور يصلك كإشعار']],
 ['file','المواد والملفات','لكل مادة ملفاتها: PDF وWord وExcel وصور.',['زر «عرض» يفتح الملف داخل الصفحة بدون تنزيله','زر «تنزيل» لحفظه على جهازك','أي ملف تفتحه يبقى متاحاً بدون إنترنت أيضاً','«حفظ بدون إنترنت» أو «حفظ كل الملفات» من الإعدادات']],
 ['hw','الواجبات','كل واجب بعنوانه وتفاصيله وصورته وموعد تسليمه.',['يظهر الوقت المتبقي بألوان تنبيه عند اقتراب الموعد','تصلك علامة وإشعار عند نزول واجب جديد']],
 ['notice','التنبيهات وأخبار الفرع','لا يفوتك أي جديد.',['صندوق التنبيهات للملاحظات المهمة','شريط «أخبار الفرع» الأحمر المتحرك','علامة «جديد» فوق الزر المقصود وإشعار يظهر في الشاشة ثم يختفي','إشعارات تصلك حتى والتطبيق مغلق مع صوت منبه (فعّلها من الإعدادات)']],
 ['photo','مشاركة الصور (جديد)','زر «مشاركة الصور» بجانب أزرار الكورسات.',['ألبوم تتنقل فيه بين الصور بالأسهم أو بالسحب','يظهر اسم صاحب كل صورة','النشر متاح فقط للطلبة المضافة أسماؤهم من الأدمن','عند أول دخول تختار اسمك من القائمة مرة واحدة، ويختفي بعدها من عند الجميع']],
 ['subject','أدوات أخرى','',['الوضع الليلي وصوت التنبيه من زر الإعدادات ⚙️','ألوان الأزرار يتحكم بها الأدمن','معلومات المطوّر م. حمزة فلاح وواتساب وانستغرام في أسفل الصفحة','يمكنك إعادة هذه الجولة من الإعدادات']]
];
function openTour(){
  ls.set('mi_tour',1);let i=0;
  const draw=sh=>{
    const t=TOUR[i],last=i===TOUR.length-1;
    sh.innerHTML='<div class="tour-ic">'+(NF_ICON[t[0]]||NF_ICON.news)+'</div><h2>'+esc(t[1])+'</h2>'+(t[2]?'<p>'+esc(t[2])+'</p>':'')+'<ul class="tour-ul">'+t[3].map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><div class="dots">'+TOUR.map((_,k)=>'<i'+(k===i?' class="on"':'')+'></i>').join('')+'</div><div class="foot" style="justify-content:space-between"><button class="btn pri" id="tn">'+(last?'ابدأ الاستخدام':'التالي')+'</button>'+(i>0?'<button class="btn" id="tp">السابق</button>':'')+(last?'':'<button class="btn" id="ts">تخطي</button>')+'</div>';
    sh.querySelector('#tn').onclick=()=>{if(last)closeModal();else{i++;draw(sh)}};
    const p=sh.querySelector('#tp');if(p)p.onclick=()=>{i--;draw(sh)};
    const sk=sh.querySelector('#ts');if(sk)sk.onclick=closeModal;
  };
  openModal('',sh=>draw(sh));
}

/* ---------- settings ---------- */
function settingsPanel(){
  const perm='Notification' in window?Notification.permission:'unsupported';
  openModal('<h2>الإعدادات</h2>'+
  '<div class="sw"><div><b>الوضع الليلي</b><small>تبديل بين النهاري والداكن</small></div><button class="tg" id="s-theme" role="switch" aria-checked="'+isDark()+'" aria-label="الوضع الليلي"></button></div>'+
  '<div class="sw"><div><b>التنبيهات والإشعارات</b><small>'+(perm==='denied'?'محظورة من إعدادات المتصفح':perm==='unsupported'?'غير مدعومة في هذا المتصفح':'إشعار عند كل تحديث أو ملف جديد حتى والصفحة مغلقة')+'</small></div><button class="tg" id="s-notif" role="switch" aria-checked="'+(set.notif&&perm==='granted')+'" aria-label="الإشعارات"></button></div>'+
  '<div class="sw"><div><b>صوت المنبه</b><small>يعمل مع كل تنبيه جديد</small></div><button class="tg" id="s-sound" role="switch" aria-checked="'+set.sound+'" aria-label="صوت المنبه"></button></div>'+
  (meObj()?'<div class="sw"><div><b>اسمك في مشاركة الصور</b><small>'+esc(meObj().name)+' · لا يمكن تغييره</small></div></div>':'')+
  '<div class="sw"><div><b>العمل بدون إنترنت</b><small>الجدول والواجبات يُحفظان تلقائياً. اضغط لحفظ كل الملفات أيضاً.</small></div><button class="btn sm" id="s-offall">حفظ كل الملفات</button></div>'+
  '<div class="sw"><div><b>جولة الميزات</b><small>عرض كل ميزات التطبيق والتحديثات</small></div><button class="btn sm" id="s-tour">عرض</button></div>'+
  '<div class="foot" style="margin-top:14px"><button class="btn" id="s-test">تجربة الصوت</button><button class="btn pri" id="cl">تم</button></div>',sh=>{
    const flip=(id,key,fn)=>sh.querySelector(id).onclick=async e=>{const t=e.currentTarget;const nv=await fn();t.setAttribute('aria-checked',String(nv))};
    flip('#s-theme','theme',async()=>{const to=isDark()?'light':'dark';set.theme=to;saveSet();applyTheme();return to==='dark'});
    flip('#s-sound','sound',async()=>{set.sound=!set.sound;saveSet();if(set.sound){unlock();setTimeout(alarm,50)}return set.sound});
    flip('#s-notif','notif',async()=>{
      if(set.notif){await disablePush();set.notif=false;saveSet();toast('تم إيقاف الإشعارات');return false}
      try{await enablePush();set.notif=true;saveSet();toast('تم تفعيل الإشعارات');return true}catch(e){toast(e.message||'تعذر تفعيل الإشعارات','err');return false}});
    sh.querySelector('#s-offall').onclick=async e=>{
      const b=e.currentTarget,todo=FILES.filter(f=>!offIds.has(f.id));
      if(!todo.length){toast('كل الملفات محفوظة بالفعل');return}
      b.disabled=true;let ok=0;
      for(let i=0;i<todo.length;i++){b.textContent='جارٍ الحفظ '+(i+1)+'/'+todo.length;if(await saveOffline(todo[i],true))ok++}
      b.textContent='تم';render();toast('تم حفظ '+ok+' من '+todo.length+' ملف للاستخدام بدون إنترنت',ok===todo.length?'':'err');
    };
    sh.querySelector('#s-tour').onclick=()=>{closeModal();openTour()};
    sh.querySelector('#s-test').onclick=()=>{unlock();setTimeout(()=>{alarm();toast('هذا صوت التنبيه')},50)};
    sh.querySelector('#cl').onclick=closeModal;
  });
}

const cached=ls.get('mi_cache',null);
if(cached&&cached.state!==undefined){S=norm(cached.state);FILES=cached.files||[];PHOTOS=cached.photos||[];cachedAt=cached.at||0;dataReady=true;snapshot()}
if(!ls.get('mi_tour',0))openTour();
render();
refreshOff();
loadSafe(true);
setInterval(()=>{if(!document.hidden&&!busy&&navigator.onLine)loadSafe(false)},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!busy)loadSafe(false)});
addEventListener('online',()=>{loadSafe(false)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){try{navigator.clearAppBadge&&navigator.clearAppBadge()}catch(e){}}});
try{const go=new URLSearchParams(location.search).get('go');if(go){const [gc,gt]=go.split('.');if(COURSES[gc])ui.course=gc;if(['schedule','subjects','hw','photos'].includes(gt)){ui.tab=gt;if(gt==='photos')photoBase=+viewed.photos||0}history.replaceState(null,'','/')}}catch(e){}
addEventListener('offline',()=>{render()});
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('message',e=>{const d=e.data||{};if(d.type==='push'&&!busy)loadSafe(false);if(d.type==='goto')gotoTarget({course:d.course,tab:d.tab})});
}
setInterval(()=>{if(ui.tab==='schedule'&&!document.hidden&&!$('#modal').innerHTML)$('#main').innerHTML=renderSchedule()},60000);
